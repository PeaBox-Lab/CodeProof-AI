name: CodeProof AI
description: Evidence-backed Python repository verification
inputs:
  path: {description: Repository path, required: false, default: .}
  fail-under: {description: Minimum score, required: false, default: "70"}
  jobs: {description: Concurrent check workers (1-8), required: false, default: "1"}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CODEPROOF_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "${CODEPROOF_ACTION_PATH}[checkers]"
    - shell: bash
      env:
        CODEPROOF_TARGET: ${{ inputs.path }}
        CODEPROOF_THRESHOLD: ${{ inputs.fail-under }}
        CODEPROOF_JOBS: ${{ inputs.jobs }}
      run: codeproof scan "$CODEPROOF_TARGET" --fail-under "$CODEPROOF_THRESHOLD" --jobs "$CODEPROOF_JOBS"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeproof-report
        path: "${{ inputs.path }}/.codeproof/reports/"
        include-hidden-files: true
