name: CodeProof AI
description: Evidence-backed Python repository verification
inputs:
  path: {description: Repository path, required: false, default: .}
  fail-under: {description: Minimum score, required: false, default: "70"}
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install "${{ github.action_path }}[checkers]"
    - shell: bash
      run: codeproof scan "${{ inputs.path }}" --fail-under "${{ inputs.fail-under }}"
    - if: always()
      uses: actions/upload-artifact@v4
      with: {name: codeproof-report, path: "${{ inputs.path }}/.codeproof/"}
