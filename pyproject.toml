[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="codeproof-ai"
version="0.1.0"
description="Evidence-backed confidence reports for Python repositories"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=["typer>=0.12,<1","rich>=13.7,<15","pydantic>=2.7,<3","PyYAML>=6,<7"]
[project.optional-dependencies]
checkers=["pytest>=8,<10","ruff>=0.6,<1","mypy>=1.11,<2","bandit>=1.7,<2","semgrep>=1.80,<2"]
dev=["codeproof-ai[checkers]"]
[project.scripts]
codeproof="codeproof.cli:app"
[tool.hatch.build.targets.wheel]
packages=["src/codeproof"]

[tool.hatch.build.targets.wheel.force-include]
"src/codeproof/gui" = "codeproof/gui"

[tool.pytest.ini_options]
testpaths=["tests"]

